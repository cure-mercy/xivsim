<svg xmlns="http://www.w3.org/2000/svg"
     width="474" height="474" viewBox="0 0 474 474">
  <defs>
    <linearGradient id="lineColour" x1="0" y1="0" x2="474" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8dbff"/>
      <stop offset="0.45" stop-color="#cfe2ff"/>
      <stop offset="0.75" stop-color="#efd7ff"/>
      <stop offset="1" stop-color="#cbe8ff"/>
    </linearGradient>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <!--
      Four wave rows per tile.
      Each row shows exactly 2 complete oscillations across a 230 px tile.
      Adjacent rows meet tangentially at alternating peaks/troughs.
      The top and bottom distance to the horizontal dividers equals one wave height.
    -->
    <g id="fourWaveRows">
      <path d="M 7.000000 45.333333 C 26.166667 45.333333, 45.333333 26.166667, 64.500000 26.166667 C 83.666667 26.166667, 102.833333 45.333333, 122.000000 45.333333 C 141.166667 45.333333, 160.333333 26.166667, 179.500000 26.166667 C 198.666667 26.166667, 217.833333 45.333333, 237.000000 45.333333 C 256.166667 45.333333, 275.333333 26.166667, 294.500000 26.166667 C 313.666667 26.166667, 332.833333 45.333333, 352.000000 45.333333 C 371.166667 45.333333, 390.333333 26.166667, 409.500000 26.166667 C 428.666667 26.166667, 447.833333 45.333333, 467.000000 45.333333"/>
<path d="M 7.000000 45.333333 C 26.166667 45.333333, 45.333333 64.500000, 64.500000 64.500000 C 83.666667 64.500000, 102.833333 45.333333, 122.000000 45.333333 C 141.166667 45.333333, 160.333333 64.500000, 179.500000 64.500000 C 198.666667 64.500000, 217.833333 45.333333, 237.000000 45.333333 C 256.166667 45.333333, 275.333333 64.500000, 294.500000 64.500000 C 313.666667 64.500000, 332.833333 45.333333, 352.000000 45.333333 C 371.166667 45.333333, 390.333333 64.500000, 409.500000 64.500000 C 428.666667 64.500000, 447.833333 45.333333, 467.000000 45.333333"/>
<path d="M 7.000000 83.666667 C 26.166667 83.666667, 45.333333 64.500000, 64.500000 64.500000 C 83.666667 64.500000, 102.833333 83.666667, 122.000000 83.666667 C 141.166667 83.666667, 160.333333 64.500000, 179.500000 64.500000 C 198.666667 64.500000, 217.833333 83.666667, 237.000000 83.666667 C 256.166667 83.666667, 275.333333 64.500000, 294.500000 64.500000 C 313.666667 64.500000, 332.833333 83.666667, 352.000000 83.666667 C 371.166667 83.666667, 390.333333 64.500000, 409.500000 64.500000 C 428.666667 64.500000, 447.833333 83.666667, 467.000000 83.666667"/>
<path d="M 7.000000 83.666667 C 26.166667 83.666667, 45.333333 102.833333, 64.500000 102.833333 C 83.666667 102.833333, 102.833333 83.666667, 122.000000 83.666667 C 141.166667 83.666667, 160.333333 102.833333, 179.500000 102.833333 C 198.666667 102.833333, 217.833333 83.666667, 237.000000 83.666667 C 256.166667 83.666667, 275.333333 102.833333, 294.500000 102.833333 C 313.666667 102.833333, 332.833333 83.666667, 352.000000 83.666667 C 371.166667 83.666667, 390.333333 102.833333, 409.500000 102.833333 C 428.666667 102.833333, 447.833333 83.666667, 467.000000 83.666667"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#lineColour)" stroke-linecap="round"
     opacity="0.03" filter="url(#softGlow)">
    <path d="M237.000000 7.000000 V467.000000
             M7.000000 122.000000 H467.000000
             M7.000000 237.000000 H467.000000
             M7.000000 352.000000 H467.000000"
          stroke-width="3"/>
  </g>

  <g fill="none" stroke="url(#lineColour)" stroke-linecap="round"
     stroke-linejoin="round" opacity="0.04" filter="url(#softGlow)">
    <g stroke-width="2.8">
      <use href="#fourWaveRows" transform="translate(0 0.000000)"/>
      <use href="#fourWaveRows" transform="translate(0 115.000000)"/>
      <use href="#fourWaveRows" transform="translate(0 230.000000)"/>
      <use href="#fourWaveRows" transform="translate(0 345.000000)"/>
    </g>
  </g>

  <g fill="none" stroke="url(#lineColour)" stroke-linecap="round" opacity="0.14">
    <path d="M237.000000 7.000000 V467.000000
             M7.000000 122.000000 H467.000000
             M7.000000 237.000000 H467.000000
             M7.000000 352.000000 H467.000000"
          stroke-width="0.9"/>
  </g>

  <g fill="none" stroke="url(#lineColour)" stroke-linecap="round"
     stroke-linejoin="round" opacity="0.22">
    <g stroke-width="0.9">
      <use href="#fourWaveRows" transform="translate(0 0.000000)"/>
      <use href="#fourWaveRows" transform="translate(0 115.000000)"/>
      <use href="#fourWaveRows" transform="translate(0 230.000000)"/>
      <use href="#fourWaveRows" transform="translate(0 345.000000)"/>
    </g>
  </g>
</svg>
