<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twelfth Circle Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="floor" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1548"/>
      <stop offset="100%" stop-color="#170b2a"/>
    </radialGradient>
    <clipPath id="arenaClip">
      <rect x="60" y="60" width="480" height="480" rx="6"/>
    </clipPath>
    <clipPath id="pallasClip">
      <rect x="60" y="60" width="480" height="360" rx="6"/>
    </clipPath>
    <clipPath id="caloricClip">
      <rect x="0" y="0" width="600" height="450" rx="6"/>
    </clipPath>
    <!-- the same floor waves seen close up, for the shrunken floor of Gaiaochos -->
    <pattern id="weaveZoom" width="80" height="80" patternUnits="userSpaceOnUse" patternTransform="translate(300 300) scale(2.6)">
      <path d="M0 40 Q20 10 40 40 T80 40" fill="none" stroke="rgba(199,160,255,0.09)" stroke-width="0.9"/>
      <path d="M0 0 Q20 -30 40 0 T80 0" fill="none" stroke="rgba(199,160,255,0.07)" stroke-width="0.9"/>
    </pattern>

    <!-- the add lasers' pulse: a soft edge, and a fading trail behind the crescent -->
    <filter id="beam-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <linearGradient id="beam-trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcb45" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffcb45" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Icon symbols (shared across both drills) -->
    <g id="icon-undo">
      <path d="M9 7 4 12l5 5M4.5 12H14a6 6 0 0 1 0 12h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-3)"/>
    </g>
    <g id="icon-redo">
      <path d="M15 7l5 5-5 5M19.5 12H10a6 6 0 0 0 0 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-3)"/>
    </g>
    <g id="icon-rewind">
      <path d="M5 5v14M19 5.5 9 12l10 6.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-reroll">
      <rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="9" cy="9" r="1.5" fill="currentColor"/><circle cx="15" cy="15" r="1.5" fill="currentColor"/>
      <circle cx="15" cy="9" r="1.5" fill="currentColor"/><circle cx="9" cy="15" r="1.5" fill="currentColor"/>
    </g>
    <g id="icon-brief">
      <path d="M6.5 3h8l4 4v14h-12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M14.5 3v4h4M9.5 11.5h6M9.5 14.5h6M9.5 17.5h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="icon-cog">
      <path d="M10.23 4.92 L10.52 2.11 L13.48 2.11 L13.77 4.92 A7.3 7.3 0 0 1 15.76 5.74 L15.76 5.74 L17.95 3.96 L20.04 6.05 L18.26 8.24 A7.3 7.3 0 0 1 19.08 10.23 L19.08 10.23 L21.89 10.52 L21.89 13.48 L19.08 13.77 A7.3 7.3 0 0 1 18.26 15.76 L18.26 15.76 L20.04 17.95 L17.95 20.04 L15.76 18.26 A7.3 7.3 0 0 1 13.77 19.08 L13.77 19.08 L13.48 21.89 L10.52 21.89 L10.23 19.08 A7.3 7.3 0 0 1 8.24 18.26 L8.24 18.26 L6.05 20.04 L3.96 17.95 L5.74 15.76 A7.3 7.3 0 0 1 4.92 13.77 L4.92 13.77 L2.11 13.48 L2.11 10.52 L4.92 10.23 A7.3 7.3 0 0 1 5.74 8.24 L5.74 8.24 L3.96 6.05 L6.05 3.96 L8.24 5.74 A7.3 7.3 0 0 1 10.23 4.92Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </g>
  <g id="icon-shield">
      <path d="M12 2 4 5v6c0 5.2 3.4 9 8 11 4.6-2 8-6.8 8-11V5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </g>
    <g id="icon-sword">
      <!-- a stylized take on the game's DPS role icon: a broad sword, point to the upper right -->
      <path d="M7.7 13.2 16.3 4.9 20.5 3.5 19.1 7.7 10.8 16.3Z" fill="currentColor" stroke="none"/>
      <path d="M10 14.1 16.3 7.7" stroke="rgba(10,9,22,0.45)" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <path d="M5.6 11.9 12.1 18.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M6.3 17.7 8.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="5.3" cy="18.7" r="1.6" fill="currentColor" stroke="none"/>
    </g>
    <g id="icon-tank">
      <path d="M12 2 4 5v6c0 5.2 3.4 9 8 11 4.6-2 8-6.8 8-11V5Z" fill="currentColor" stroke="rgba(10,9,22,0.5)" stroke-width="1"/>
    </g>
    <g id="icon-healer">
      <path d="M12 3.2v17.6M3.2 12h17.6" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
    </g>
    <!-- a support of either job: the tank shield's top-left half and the healer cross's bottom-right half,
         split along the diagonal from bottom left to top right -->
    <clipPath id="clip-support-tl"><path d="M0 0H24L0 24Z"/></clipPath>
    <clipPath id="clip-support-br"><path d="M24 0V24H0Z"/></clipPath>
    <g id="icon-support">
      <g clip-path="url(#clip-support-tl)">
        <path d="M12 2 4 5v6c0 5.2 3.4 9 8 11 4.6-2 8-6.8 8-11V5Z" fill="var(--umbral-soft)" stroke="rgba(10,9,22,0.5)" stroke-width="1"/>
      </g>
      <g clip-path="url(#clip-support-br)">
        <path d="M12 3.2v17.6M3.2 12h17.6" stroke="var(--good)" stroke-width="3.6" stroke-linecap="round"/>
      </g>
      <path d="M2.5 21.5 21.5 2.5" stroke="rgba(241,236,249,0.55)" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g id="icon-dps">
      <!-- a stylized take on the game's DPS role icon: a broad sword, point to the upper right -->
      <path d="M7.7 13.2 16.3 4.9 20.5 3.5 19.1 7.7 10.8 16.3Z" fill="currentColor" stroke="none"/>
      <path d="M10 14.1 16.3 7.7" stroke="rgba(10,9,22,0.45)" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <path d="M5.6 11.9 12.1 18.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <path d="M6.3 17.7 8.5 15.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="5.3" cy="18.7" r="1.6" fill="currentColor" stroke="none"/>
    </g>
    <g id="icon-add">
      <circle cx="12" cy="12" r="4" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="12" y1="12" x2="12" y2="3"/>
        <line x1="12" y1="12" x2="12" y2="21"/>
        <line x1="12" y1="12" x2="3" y2="12"/>
        <line x1="12" y1="12" x2="21" y2="12"/>
        <line x1="12" y1="12" x2="5.4" y2="5.4"/>
        <line x1="12" y1="12" x2="18.6" y2="18.6"/>
        <line x1="12" y1="12" x2="5.4" y2="18.6"/>
        <line x1="12" y1="12" x2="18.6" y2="5.4"/>
      </g>
    </g>
    <g id="icon-donut">
      <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="5"/>
    </g>
    <g id="icon-orb">
      <circle cx="12" cy="12" r="8" fill="currentColor"/>
    </g>
    <g id="icon-spread">
      <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="12" y1="8" x2="12" y2="2"/>
        <line x1="12" y1="16" x2="12" y2="22"/>
        <line x1="8" y1="12" x2="2" y2="12"/>
        <line x1="16" y1="12" x2="22" y2="12"/>
        <line x1="9.2" y1="9.2" x2="5" y2="5"/>
        <line x1="14.8" y1="14.8" x2="19" y2="19"/>
        <line x1="9.2" y1="14.8" x2="5" y2="19"/>
        <line x1="14.8" y1="9.2" x2="19" y2="5"/>
      </g>
    </g>
    <g id="icon-stack">
      <circle cx="9" cy="9" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="15" cy="15" r="4.2" fill="currentColor" opacity="0.9"/>
    </g>
    <g id="icon-move">
    <g stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M4 12h13"/>
      <path d="M13 7l5 5-5 5"/>
    </g>
  </g>
  <g id="icon-hold">
      <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
    </g>
    <g id="icon-jack">
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="3.5" x2="12" y2="20.5"/>
        <line x1="4.6" y1="7.8" x2="19.4" y2="16.2"/>
        <line x1="4.6" y1="16.2" x2="19.4" y2="7.8"/>
      </g>
      <g fill="currentColor">
        <circle cx="12" cy="3.5" r="2.1"/><circle cx="12" cy="20.5" r="2.1"/>
        <circle cx="4.6" cy="7.8" r="2.1"/><circle cx="19.4" cy="16.2" r="2.1"/>
        <circle cx="4.6" cy="16.2" r="2.1"/><circle cx="19.4" cy="7.8" r="2.1"/>
      </g>
    </g>
  </defs>
</svg>

<div class="page">

  <header class="masthead">
    <div class="brand">
      <img class="brand-logo" src="assets/syncademy-logo.png" alt="Syncademy" width="210" height="210">
      <p class="eyebrow">Pandæmonium · The Twelfth Circle (Savage) · Athena</p>
    </div>
  </header>

  <div class="nav-row">
    <nav class="mech-nav" id="tabs" aria-label="Choose a mechanic"></nav>
    <div class="nav-actions">
      <a class="brief-link" href="briefs.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><use href="#icon-brief"/></svg>
        <span>Briefs</span>
      </a>
      <div class="settings-wrap">
        <button type="button" class="icon-btn" id="settingsBtn" aria-haspopup="dialog"
                aria-expanded="false" aria-controls="settingsPanel" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><use href="#icon-cog"/></svg>
        </button>
        <div class="settings-pop" id="settingsPanel" hidden role="dialog" aria-label="Settings">
          <h2>Settings</h2>
          <label class="opt-row">
            <input type="checkbox" id="optHints">
            <span><b>Show hints</b>Each step adds the rule it asks you to read: which chain lands first, where the tethers go, how the spread is ordered.</span>
          </label>
          <label class="opt-row">
            <input type="checkbox" id="optAuto">
            <span><b>Automatically advance</b>When your answer is right, move straight to the next step instead of waiting for the continue button. The button at the end of a pull always stays.</span>
          </label>
          <div class="opt-group">
            <span class="opt-text" id="optLayoutLabel"><b>Layout</b>Auto shows three columns on wide screens and two on narrower ones. Phones always stack.</span>
            <div class="opt-seg" role="group" aria-labelledby="optLayoutLabel">
              <button type="button" data-layout="auto">Auto</button>
              <button type="button" data-layout="three">3 columns</button>
              <button type="button" data-layout="two">2 columns</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- each mechanic adds its own panel here -->
</div>

<script src="js/core.js"></script>
<script src="mechanics/paradeigma-1.js"></script>
<script src="mechanics/paradeigma-2.js"></script>
<script src="mechanics/superchain-1.js"></script>
<script src="mechanics/paradeigma-3.js"></script>
<script src="mechanics/palladion.js"></script>
<script src="mechanics/superchain-2.js"></script>
<script src="mechanics/gaiaochos-1.js"></script>
<script src="mechanics/classical-concepts-1.js"></script>
<script src="mechanics/caloric-theory-1.js"></script>
<script src="mechanics/pangenesis.js"></script>
<script src="mechanics/classical-concepts-2.js"></script>
<script src="mechanics/caloric-theory-2.js"></script>
<script src="mechanics/gaiaochos-2.js"></script>
<script>Twelfth.start();</script>

</body>
</html>
